; ダイナマリサ3D 高解像度化 MOD の設定
; dynamarisa_hd_config.exe から変更することもできます

[Graphics]
; 内部描画解像度。0 ならモニターの解像度。16:9 で指定サイズに収まる最大に調整されます
RenderWidth=0
RenderHeight=0
; 内部解像度に掛ける倍率 (1.5 / 2.0 でスーパーサンプリング)
Supersample=1.0
; 影マップの解像度倍率 (1 = 標準 1024, 2 = 2048, 4 = 4096)
ShadowScale=2
; 異方性フィルタ (0 = オフ, 4 / 8 / 16)
Anisotropy=16
; グロー・ぼかし用の小さなバッファも高解像度化する (1 = する)
EffectScale=1
; 遠景ぼかし(被写界深度)の強さ (0.0 = オフ, 0.5 = 弱め, 1.0 = オリジナル)
DepthOfField=0.0
; フレームレート上限 (0 = モニターに合わせる(垂直同期), 60 / 120 / 144 / 165 / 240, -1 = 無制限)
FrameLimit=0
; フレーム補間 (1 = オン)。ゲームロジックは 60Hz 固定なので、その間を補間して 60fps 超で描く (実験的)
FrameInterpolation=0

[Window]
; ウィンドウモード時のクライアントサイズ。0 なら画面に収まる最大の 16:9 サイズ
Width=0
Height=0
; Alt+Enter 全画面時にウィンドウが左上にずれる不具合を補正する (1 = する)
FixFullscreen=1

[Control]
; 照準(カメラ回転)の慣性。0 = なし (マウス/パッドの入力をそのフレームで全量反映), 1 = オリジナル
AimSmoothing=0
; マウス照準の細かさ。1カウントあたりの回転量を 1/N にする (1 = 標準 約0.23度, 2 / 3 / 4)。
; 細かくした分は回る量が減るので、マウスの DPI かゲーム内の感度を上げて速さを合わせる
MouseAimPrecision=1

[Debug]
; 1 で d3d9mod.log に動作ログを出力
Log=0
